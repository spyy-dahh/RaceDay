name: RaceDay MVC Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build-mvc:
    runs-on: ubuntu-latest
    name: Build MVC Project

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore MVC dependencies
        run: dotnet restore "RaceDay,MVC/RaceDay.MVC.csproj"

      - name: Build MVC
        run: dotnet build "RaceDay,MVC/RaceDay.MVC.csproj" --configuration Release --no-restore
